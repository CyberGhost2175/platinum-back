name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/main/platinum-back
            flock -w 180 /tmp/platinum-back-deploy.lock bash -euxc '
              git pull origin main
              leftover=$(docker ps -aq --filter name=platinum-app)
              if [ -n "$leftover" ]; then
                docker rm -f $leftover
              fi
              docker compose up -d --build --remove-orphans --force-recreate app
              docker compose exec -T app npx typeorm migration:run -d dist/database/data-source.js
            '
